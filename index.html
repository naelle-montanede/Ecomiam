<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panier Malin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>Panier Malin</h1><p>Mangez bien, dépensez juste, gaspillez moins.</p></header>
<main>
<section id="v-courses" class="vue">
  <form id="foyer" aria-label="Mon foyer">
    <label>Adultes <input type="number" id="adultes" min="1" max="12" value="2"></label>
    <label>Enfants <input type="number" id="enfants" min="0" max="12" value="0"></label>
    <label>Budget semaine (€) <input type="number" id="budget" min="10" step="5" value="70"></label>
  </form>
  <div id="resume"></div>
  <ul id="liste"></ul>
  <form id="ajout"><input id="ajout-nom" placeholder="Ajouter un produit" required><input id="ajout-prix" type="number" step="0.1" min="0" placeholder="Prix €" required><button>Ajouter</button></form>
</section>
<section id="v-gaspi" class="vue" hidden>
  <div class="filtres" role="group" aria-label="Filtrer">
    <button data-f="tous" aria-pressed="true">Tout</button><button data-f="marché" aria-pressed="false">Marchés</button><button data-f="magasin" aria-pressed="false">Magasins</button>
  </div>
  <ul id="offres"></ul>
</section>
</main>
<nav>
  <button data-v="courses" aria-current="page">Mes courses</button>
  <button data-v="gaspi">Anti-gaspi</button>
</nav>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
